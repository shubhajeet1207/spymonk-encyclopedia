# Optional local checks that stop secrets and lint errors before they leave
# your machine (the repository is public, so CI finding a secret is too late).
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: repo-policy
        name: SpyMonk repository policy
        entry: python scripts/ci/check_repo_policy.py
        language: system
        pass_filenames: false
