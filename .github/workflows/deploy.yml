# Continuous delivery: after CI passes on main, deploy that exact commit to the
# Hugging Face Space. Does nothing until the HF_SPACE_ID variable is set.
# Setup: docs/CI_CD.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  space:
    name: Deploy to Hugging Face Spaces
    if: >
      vars.HF_SPACE_ID != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://huggingface.co/spaces/${{ vars.HF_SPACE_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install "huggingface_hub==1.33.0" "python-dotenv>=1.0"
      - name: Upload the app to the Space
        env:
          # A write token for the Space only; the Space keeps its own secrets.
          HF_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: python scripts/deploy_hf_space.py --space "$HF_SPACE_ID"
