    <text x="1520" y="76" text-anchor="end" fill="#b8afc4" font-family="Consolas, monospace" font-size="14" letter-spacing="2">MEMORY FIRST / EVIDENCE LED</text>

    <text x="76" y="205" fill="#fff4e7" font-size="100" font-weight="700" letter-spacing="-5">SpyMonk</text>
    <text x="81" y="269" fill="#f5806a" font-size="49" font-weight="400" letter-spacing="1">Encyclopedia</text>
    <text x="82" y="337" fill="#fff4e7" font-size="28" font-weight="600">Build a research memory.</text>
    <text x="82" y="375" fill="#bdb5cc" font-size="28">Keep the evidence.</text>

