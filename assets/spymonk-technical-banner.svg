<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">SpyMonk Encyclopedia — Build a research memory. Keep the evidence.</title>
  <desc id="desc">A graphite and coral technical banner. Articles and reference PDFs connect to a cross-check node, a Chroma memory store, and a cited answer. The stack rail features React, Vite, Python, FastAPI, LangChain, and Vercel logos. All artwork is vector-based.</desc>
